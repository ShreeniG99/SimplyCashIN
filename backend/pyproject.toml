[project]
name = "simplycashin"
version = "0.1.0"
description = "SimplyCashIN — agentic receivables for Indian MSME owners"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=0.69",
    "posthog>=3.5",
    "redis>=5.0",
    "apscheduler>=3.10",
    "python-multipart>=0.0.9",
    "twilio>=9.0",
    "aiosmtplib>=3.0",
    "celery>=5.4",
    "PyJWT>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "db: requires a running Postgres (docker-compose up)",
    "redis: requires a running Redis (docker-compose up)",
    "integration: hits the real Anthropic API",
]
addopts = "-m 'not integration'"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
