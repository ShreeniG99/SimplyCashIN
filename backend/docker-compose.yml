services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: scin
      POSTGRES_PASSWORD: scin
      POSTGRES_DB: scin
    ports:
      - "5432:5432"
    volumes:
      - scin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scin"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - scin_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  scin_pgdata:
  scin_redis:
