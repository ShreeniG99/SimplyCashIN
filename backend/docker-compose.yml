services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: scin
      POSTGRES_PASSWORD: scin
      POSTGRES_DB: scin
    ports:
      - "5432:5432"
    volumes:
      - scin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scin"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  scin_pgdata:
